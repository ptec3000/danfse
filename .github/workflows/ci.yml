name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - name: Verify installed gem outside Bundler
        run: |
          gem build danfse.gemspec
          gem install --local --no-document ./danfse-*.gem
          cd "$(mktemp -d)"
          env -u BUNDLE_GEMFILE -u RUBYOPT -u BUNDLE_PATH ruby -e 'require "danfse"; abort "versão incorreta" unless Danfse::VERSION == "0.1.1"; puts Danfse::VERSION'
