name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - name: Verify installed gem outside Bundler
        run: |
          gem build danfse.gemspec
          gem install --no-document ./danfse-*.gem
          cd "$(mktemp -d)"
          env -u BUNDLE_GEMFILE -u RUBYOPT -u BUNDLE_PATH EXPECTED="$(ruby -e 'print Gem::Specification.load(ARGV[0]).version' "$GITHUB_WORKSPACE/danfse.gemspec")" ruby -e 'require "danfse"; abort "versão incorreta: #{Danfse::VERSION}" unless Danfse::VERSION == ENV.fetch("EXPECTED"); puts Danfse::VERSION'
